name: Build Android APK (32-bit & 64-bit)

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APKs (32-bit & 64-bit)
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APKs (32-bit & 64-bit)
        run: ./gradlew assembleRelease --stacktrace

      - name: List Generated APKs
        run: |
          echo "=== Debug APKs ==="
          ls -la app/build/outputs/apk/debug/ || true
          echo "=== Release APKs ==="
          ls -la app/build/outputs/apk/release/ || true

      - name: Organize APK Artifacts
        run: |
          mkdir -p output-apks
          # Find and copy APKs flexibly
          find app/build/outputs/apk/ -type f -name "*.apk" -exec cp {} output-apks/ \;
          ls -la output-apks/
          
          # Create clean branded symlinks/copies
          find output-apks/ -name "*armeabi-v7a*.apk" -exec cp {} output-apks/OpenCut-32bit-armeabi-v7a.apk \; 2>/dev/null || true
          find output-apks/ -name "*arm64-v8a*.apk" -exec cp {} output-apks/OpenCut-64bit-arm64-v8a.apk \; 2>/dev/null || true
          find output-apks/ -name "*universal*.apk" -exec cp {} output-apks/OpenCut-Universal.apk \; 2>/dev/null || true
          
          echo "=== Final APKs in output-apks ==="
          ls -lh output-apks/

      - name: Upload APKs as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCut-Mobile-APKs
          path: output-apks/*.apk
          retention-days: 14

      - name: Publish GitHub Release (When Tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
